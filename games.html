<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Games Universe - Catalog</title>
  <link rel="stylesheet" href="/assets/css/site.css">
  <link rel="stylesheet" href="/assets/css/games-universe.css">
</head>
<body>
  <div id="app">
    <header class="universe-header">
      <h1>Games Universe</h1>
    </header>
    
    <main class="universe-main">
      <!-- Grid container where game panels are injected in batches -->
      <div id="games-container" class="games-grid"></div>
      
      <!-- Sentinel element for lazy infinite scrolling -->
      <div id="scroll-sentinel" style="height: 40px; width: 100%;"></div>
    </main>
  </div>

  <!-- Non-blocking asynchronous scripts -->
  <script type="module" src="/assets/js/games-universe/app.js" defer></script>
  <script src="/assets/js/dev/games-catalog.js" defer></script>
</body>
</html>
