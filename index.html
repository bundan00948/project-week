<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Macau Traffic Monitor</title>
<style>
  body { margin: 0; min-height: 100vh; background: #0b0d12; color: #fff; font-family: system-ui, -apple-system, Segoe UI, sans-serif;
    display: flex; align-items: center; justify-content: center; }
  .box { text-align: center; padding: 2rem; opacity: 0.9; }
  .spin { width: 28px; height: 28px; margin: 0 auto 14px; border: 3px solid rgba(255,215,0,0.25);
    border-top-color: #ffd700; border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="box">
  <div class="spin"></div>
  <div>Loading Macau Traffic Monitor…</div>
</div>
<script>
(async function () {
  const urls = [
    'https://cdn.jsdelivr.net/gh/bundan00948/project-week@6e724c55b1264ae7998cba313d861fd6734eee41/index.html',
    'https://raw.githubusercontent.com/bundan00948/project-week/6e724c55b1264ae7998cba313d861fd6734eee41/index.html'
  ];
  let lastErr = null;
  for (const url of urls) {
    try {
      const res = await fetch(url, { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const html = await res.text();
      if (!html.includes('Macau Traffic Monitor') || html.length < 1000) throw new Error('Unexpected payload');
      document.open();
      document.write(html);
      document.close();
      return;
    } catch (e) { lastErr = e; }
  }
  document.body.innerHTML = '<div class="box"><p>Could not load the site.</p><p><a style="color:#ffd700" href="https://cdn.jsdelivr.net/gh/bundan00948/project-week@6e724c55b1264ae7998cba313d861fd6734eee41/index.html">Open previous version</a></p><pre style="text-align:left;opacity:0.7">' + (lastErr && lastErr.message ? lastErr.message : 'unknown error') + '</pre></div>';
})();
</script>
</body>
</html>
