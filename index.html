<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Macau Traffic Monitor</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" href="https://i.postimg.cc/XNyP9t3q/Screenshot-2026-01-21-at-23-44-24-removebg-preview.png" type="image/x-icon">
    
    <!-- Firebase SDK -->
    <script type="module">
        // Import the functions you need from the SDKs you need
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-analytics.js";
        import { getDatabase, ref, onValue, push, set, remove, get, query, orderByChild, equalTo, limitToLast, onChildAdded, onChildChanged, onChildRemoved } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        
        // Your web app's Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyCFk_4BSjnAE65-H7JxX8dOvtc86qlWlQ0",
            authDomain: "macau-traffic-database.firebaseapp.com",
            projectId: "macau-traffic-database",
            storageBucket: "macau-traffic-database.firebasestorage.app",
            messagingSenderId: "149938244922",
            appId: "1:149938244922:web:b4edaf4298b7e15e899403",
            measurementId: "G-JSSBLM1R4K"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const database = getDatabase(app);
        const auth = getAuth(app);
        
        // Make Firebase objects globally accessible
        window.firebaseApp = app;
        window.firebaseDatabase = database;
        window.firebaseAuth = auth;
        window.firebaseFunctions = {
            ref, onValue, push, set, remove, get, query, orderByChild, equalTo, limitToLast, onChildAdded, onChildChanged, onChildRemoved,  
            createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.18/dist/hls.min.js"></script>
    
    <style>
        /* All existing CSS styles remain unchanged */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)), 
                        url('https://img1.wsimg.com/isteam/getty/2154404610') no-repeat center center fixed;
            background-size: cover;
            color: #fff;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            padding: 20px 0;
            margin-bottom: 20px;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            position: relative;
        }
        
        /* Language Selector Styles */
        .language-selector {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 1000;
        }
        
        .lang-btn {
            background: rgba(255, 215, 0, 0.8);
            color: #000;
            border: none;
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: all 0.3s ease;
        }
        
        .lang-btn:hover {
            background: rgba(255, 215, 0, 1);
            transform: translateY(-2px);
        }
        
        .lang-dropdown {
            position: absolute;
            top: 100%;
            right: 0;
            background: rgba(0, 0, 0, 0.9);
            border-radius: 10px;
            padding: 10px;
            margin-top: 5px;
            display: none;
            min-width: 150px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }
        
        .lang-dropdown.show {
            display: block;
        }
        
        .lang-option {
            padding: 8px 12px;
            color: #fff;
            text-decoration: none;
            display: block;
            border-radius: 5px;
            transition: background 0.3s;
        }
        
        .lang-option:hover {
            background: rgba(255, 215, 0, 0.3);
        }
        
        .logo-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 10px;
        }
        
        .logo {
            width: 80px;
            height: 80px;
            background: linear-gradient(45deg, #ffd700, #ff8c00);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
        }
        
        .logo i {
            font-size: 40px;
            color: #8b0000;
        }
        
        h1 {
            font-size: 2.8rem;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
            margin-bottom: 5px;
        }
        
        .subtitle {
            font-size: 1.2rem;
            opacity: 0.9;
            max-width: 600px;
            margin: 0 auto 20px;
        }
        
        .nav-tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 20px 0;
            flex-wrap: wrap;
        }
        
        .nav-tab {
            padding: 12px 25px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .nav-tab:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-3px);
        }
        
        .nav-tab.active {
            background: #ffd700;
            color: #000;
        }

        .page {
            display: none;
            animation: fadeIn 0.5s ease;
        }
        
        .page.active {
            display: block;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .dashboard {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .map-container {
            flex: 3;
            min-width: 300px;
            height: 700px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            position: relative;
        }
        
        #map {
            width: 100%;
            height: 100%;
            border-radius: 15px;
            border: none;
        }
        
        .info-panel {
            flex: 1;
            min-width: 250px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.18);
        }
        
        .panel-title {
            font-size: 1.5rem;
            margin-bottom: 20px;
            text-align: center;
            color: #ffd700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .traffic-status {
            display: flex;
            justify-content: space-between;
            margin-bottom: 25px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
        }
        
        .status-item {
            text-align: center;
        }
        
        .status-value {
            font-size: 1.8rem;
            font-weight: bold;
            margin: 5px 0;
        }
        
        .status-label {
            font-size: 0.9rem;
            opacity: 0.8;
        }
        
        .congestion-high { color: #ff4d4d; }
        .congestion-medium { color: #ffcc00; }
        .congestion-low { color: #4dff4d; }
        
        .waiting-times {
            margin-top: 20px;
        }
        
        .waiting-time-item {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }
        
        .waiting-time-item:hover {
            background: rgba(255, 255, 255, 0.1);
            padding-left: 10px;
        }
        
        .waiting-time-item:last-child {
            border-bottom: none;
        }
        
        .location-name {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .time-display {
            font-weight: bold;
        }
        
        .time-low { color: #4dff4d; }
        .time-medium { color: #ffcc00; }
        .time-high { color: #ff4d4d; }
        .time-severe { color: #9932cc; }
        .time-closed { color: #808080; }
        
        .legend {
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border-radius: 8px;
            margin-top: 20px;
        }
        
        .legend-title {
            font-weight: bold;
            margin-bottom: 8px;
            color: #ffd700;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            margin-bottom: 5px;
            font-size: 0.9rem;
        }
        
        .legend-color {
            width: 20px;
            height: 20px;
            border-radius: 3px;
            margin-right: 10px;
        }
        
        .legend-severe { background-color: #9932cc; }
        .legend-high { background-color: #ff4d4d; }
        .legend-medium { background-color: #ffcc00; }
        .legend-low { background-color: #4dff4d; }
        .legend-closed { background-color: #808080; }
        
        .app-promo {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            margin-top: 20px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.18);
        }
        
        .app-promo h2 {
            color: #ffd700;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
<div class="container">
  <header>
    <div class="logo-container">
      <div class="logo"><i class="fas fa-car"></i></div>
      <div>
        <h1>Macau Traffic Monitor</h1>
        <p class="subtitle">Real-time traffic conditions across Macau</p>
      </div>
    </div>
  </header>
  <div class="nav-tabs">
    <div class="nav-tab active">Dashboard</div>
    <div class="nav-tab">Cameras</div>
    <div class="nav-tab">Weather</div>
    <div class="nav-tab">News</div>
  </div>
  <div class="dashboard">
    <div class="map-container">
      <iframe id="map" src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d14736.8!2d113.54!3d22.19!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zMjLCsDExJzI0LjAiTiAxMTPCsDMyJzI0LjAiRQ!5e0!3m2!1sen!2s!4v1234567890" allowfullscreen loading="lazy"></iframe>
    </div>
    <div class="info-panel">
      <div class="panel-title"><i class="fas fa-traffic-light"></i> Live Status</div>
      <div class="traffic-status">
        <div class="status-item">
          <div class="status-value congestion-low">Light</div>
          <div class="status-label">Overall</div>
        </div>
        <div class="status-item">
          <div class="status-value">12</div>
          <div class="status-label">Avg Wait</div>
        </div>
      </div>
      <div class="waiting-times" data-route-list></div>
      <div class="legend">
        <div class="legend-title">Legend</div>
        <div class="legend-item"><div class="legend-color legend-low"></div> Light</div>
        <div class="legend-item"><div class="legend-color legend-medium"></div> Moderate</div>
        <div class="legend-item"><div class="legend-color legend-high"></div> Heavy</div>
      </div>
    </div>
  </div>
</div>
<script src="assets/js/traffic.js"></script>
</body>
</html>
